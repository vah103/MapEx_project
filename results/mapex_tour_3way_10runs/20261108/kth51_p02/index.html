<script>
const data = JSON.parse(document.getElementById('dataset').textContent);
const methods = document.getElementById('methods');
const decisions = document.getElementById('decisions');
const gallery = document.getElementById('galleries');
let active = data.methods[0].key;
for (const method of data.methods) {
  const button = document.createElement('button');
  button.textContent = method.label + ' · ' + method.count;
  button.dataset.key = method.key;
  button.onclick = () => select(method.key);
  methods.appendChild(button);
  const group = document.createElement('section');
  group.className = 'gallery';group.id = 'gallery-' + method.key;
  for (const d of method.frames) {
    const fig = document.createElement('figure'); fig.id = method.key + '-D' + d.n;
    const caption = document.createElement('figcaption');
    caption.textContent = 'D' + String(d.n).padStart(2,'0') + ' · tick ' + d.tick;
    const img = document.createElement('img');img.src = d.image;img.loading = 'lazy';
    img.alt = method.label + ' – quyết định ' + d.n + ', tick ' + d.tick;
    fig.append(caption,img);group.appendChild(fig);
  }
  gallery.appendChild(group);
}
function select(key) {
  active = key;
  for (const b of methods.children) b.classList.toggle('active', b.dataset.key === key);
  for (const s of gallery.children) s.hidden = s.id !== 'gallery-'+key;
  decisions.replaceChildren();
  const method = data.methods.find(x => x.key === key);
  for (const d of method.frames) {
    const button=document.createElement('button');button.textContent='D'+String(d.n).padStart(2,'0');
    button.onclick=()=>document.getElementById(key+'-D'+d.n).scrollIntoView({behavior:'smooth'});
    decisions.appendChild(button);
  }
  window.scrollTo({top:0,behavior:'instant'});
}
select(active);
</script></body></html>
